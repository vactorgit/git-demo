<!doctype html>
<!-- Character power card. RULE: every character introduced gets one; powers are stated explicitly.
     vars: name ("Moon Knight"), alias ("Marc Spector"), powers (["Super strength at full moon", ...]),
           side ("right" | "left"), image (optional path to character art) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { width: {{W}}px; height: {{H}}px; }
      #card { position: absolute; top: 8vmin; width: min(46vmin, 88vw); overflow: hidden; }
      #card.right { right: 5vmin; }
      #card.left { left: 5vmin; }
      .portrait #card { top: 12vh; width: 80vw; left: 10vw !important; right: auto !important; }
      #head { background: var(--fire); border-bottom: var(--border) solid var(--ink); padding: 2.2vmin 2.6vmin 1.6vmin; position: relative; }
      #name { font-size: 6.4vmin; }
      #alias { font-size: 2.6vmin; color: var(--ink); margin-top: 0.6vmin; }
      #art { width: 100%; height: 24vmin; object-fit: cover; display: block; border-bottom: var(--border) solid var(--ink); }
      #body { padding: 2vmin 2.6vmin 2.4vmin; }
      #label { font-size: 3.4vmin; margin-bottom: 1.2vmin; display: inline-block; }
      .power { display: flex; align-items: flex-start; gap: 1.4vmin; font-size: 3vmin; color: var(--ink); line-height: 1.2; margin-top: 1.2vmin; }
      .bolt { flex: 0 0 auto; width: 3.4vmin; height: 3.4vmin; background: var(--red); border: max(3px, 0.4vmin) solid var(--ink);
              clip-path: polygon(55% 0, 10% 58%, 45% 58%, 30% 100%, 90% 38%, 55% 38%, 75% 0); margin-top: -0.2vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="card" class="panel clip" data-start="0" data-duration="{{DUR}}">
        <div id="head" class="halftone-bg" style="background-color: var(--fire)">
          <div id="name" class="display ink-outline"></div>
          <div id="alias" class="body"></div>
        </div>
        <img id="art" alt="" />
        <div id="body">
          <div id="label" class="tag">POWERS</div>
          <div id="powers"></div>
        </div>
      </div>
    </div>
    <script>
      const V = {{VARS}};
      const D = {{DUR}};
      const card = document.getElementById("card");
      if ({{H}} > {{W}}) document.body.classList.add("portrait");
      card.classList.add(V.side === "left" ? "left" : "right");
      document.getElementById("name").textContent = V.name || "";
      const alias = document.getElementById("alias");
      if (V.alias) alias.textContent = V.alias; else alias.style.display = "none";
      const art = document.getElementById("art");
      if (V.image) art.src = V.image; else art.style.display = "none";
      const list = document.getElementById("powers");
      (V.powers || []).forEach((p) => {
        const row = document.createElement("div");
        row.className = "power body";
        row.innerHTML = '<span class="bolt"></span><span></span>';
        row.lastChild.textContent = p;
        list.appendChild(row);
      });

      const dir = V.side === "left" ? -1 : 1;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { x: dir * 700, rotation: dir * 6 }, { x: 0, rotation: dir * -1.5, duration: 0.5, ease: "back.out(1.4)" }, 0);
      tl.fromTo("#name", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.5)", transformOrigin: "left center" }, 0.25);
      tl.fromTo("#label", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.45);
      tl.fromTo(".power", { opacity: 0, x: dir * 40 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.18, ease: "power2.out" }, 0.6);
      tl.to("#card", { x: dir * 800, duration: 0.4, ease: "power3.in" }, D - 0.45);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
