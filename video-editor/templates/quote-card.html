<!doctype html>
<!-- Big quote in a comic speech balloon, full-screen. Use for the lines the video turns on.
     vars: quote ("Don't be the ship. Be the king."), speaker ("ULTRON"), source (optional, e.g. "Vision Quest · Ep 2")
           bg ("halftone" | "dark") -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { width: {{W}}px; height: {{H}}px; }
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #stage.dark { background: var(--pan-dark); }
      #stage.dark #dots { background-image: radial-gradient(rgba(255,255,255,.07) 28%, transparent 31%); }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(var(--halftone) 28%, transparent 31%); background-size: 2.4vmin 2.4vmin; }
      #wrap { position: relative; max-width: 64vw; }
      #balloon { position: relative; background: var(--paper); border: calc(var(--border) * 1.3) solid var(--ink); border-radius: 50% / 42%;
                 padding: 8vmin 9vmin; box-shadow: 1.4vmin 1.4vmin 0 var(--fire), 1.4vmin 1.4vmin 0 calc(var(--border) * 1.3) var(--ink); }
      #tail { position: absolute; left: 18%; bottom: -5.6vmin; width: 9vmin; height: 7vmin; background: var(--paper);
              clip-path: polygon(0 0, 100% 0, 10% 100%); }
      #tailo { position: absolute; left: calc(18% - 1vmin); bottom: -7.4vmin; width: 11.4vmin; height: 8.8vmin; background: var(--ink);
               clip-path: polygon(0 0, 100% 0, 9% 100%); }
      #quote { font-size: 7.4vmin; text-align: center; color: var(--ink); line-height: 1.05; }
      #speaker { position: absolute; left: 6%; bottom: -14vmin; font-size: 4.4vmin; }
      #source { position: absolute; right: 4%; bottom: -12.5vmin; font-size: 2.6vmin; color: var(--ink); background: var(--paper);
                border: var(--border) solid var(--ink); padding: 0.6vmin 1.4vmin; }
      #stage.dark #source { color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="stage" class="clip halftone-bg" data-start="0" data-duration="{{DUR}}">
        <div id="dots"></div>
        <div id="wrap">
          <div id="tailo"></div>
          <div id="balloon"><div id="quote" class="display"></div></div>
          <div id="tail"></div>
          <div id="speaker" class="tag"></div>
          <div id="source" class="body"></div>
        </div>
      </div>
    </div>
    <script>
      const V = {{VARS}};
      const D = {{DUR}};
      document.getElementById("quote").textContent = V.quote || "";
      const sp = document.getElementById("speaker");
      if (V.speaker) sp.textContent = V.speaker; else sp.style.display = "none";
      const so = document.getElementById("source");
      if (V.source) so.textContent = V.source; else so.style.display = "none";
      if (V.bg === "dark") { const st = document.getElementById("stage"); st.classList.remove("halftone-bg"); st.classList.add("dark"); }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0);
      tl.fromTo("#wrap", { scale: 0.2, rotation: -10 }, { scale: 1, rotation: -1.5, duration: 0.45, ease: "back.out(1.8)" }, 0.05);
      tl.fromTo("#quote", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.3);
      tl.fromTo("#speaker", { scale: 0, rotation: 12 }, { scale: 1, rotation: -4, duration: 0.3, ease: "back.out(3)" }, 0.55);
      tl.fromTo("#source", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7);
      tl.to("#wrap", { scale: 1.04, duration: D - 1.0, ease: "none" }, 0.5);
      tl.to("#stage", { opacity: 0, duration: 0.2 }, D - 0.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
