<!doctype html>
<!-- Review score, full-screen. Icons fill one by one.
     vars: score (4), out_of (5), label ("SHIPS OF THESEUS"), title ("EPISODE 2 VERDICT"), icon ("ship" | "star" | "flame") -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { width: {{W}}px; height: {{H}}px; }
      #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin; overflow: hidden; }
      #burst { position: absolute; left: 50%; top: 50%; width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax;
               background: repeating-conic-gradient(var(--fire) 0 7.5deg, #ffa66e 7.5deg 15deg); }
      #title { position: relative; font-size: 5vmin; }
      #icons { position: relative; display: flex; gap: 2.4vmin; }
      .ic { width: 15vmin; height: 15vmin; }
      .ic path, .ic polygon { stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
      .ic.on path, .ic.on polygon { fill: var(--red); }
      .ic.off path, .ic.off polygon { fill: var(--paper); opacity: 0.85; }
      #num { position: relative; font-size: 17vmin; }
      #label { position: relative; font-size: 5.4vmin; margin-top: -3vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="stage" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="burst"></div>
        <div id="title" class="tag"></div>
        <div id="icons"></div>
        <div id="num" class="display ink-outline"></div>
        <div id="label" class="display red-outline"></div>
      </div>
    </div>
    <script>
      const V = {{VARS}};
      const D = {{DUR}};
      const SHAPES = {
        ship: '<path d="M10 62 L90 62 L76 84 L24 84 Z"/><path d="M48 10 L48 58 L18 58 Z"/><path d="M54 18 L54 58 L82 58 Z"/>',
        star: '<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38"/>',
        flame: '<path d="M50 6 C62 30 84 40 80 66 C77 86 62 94 50 94 C36 94 20 84 20 64 C20 48 32 40 36 26 C44 38 46 44 50 46 C52 32 50 20 50 6 Z"/>',
      };
      const n = V.out_of || 5, s = V.score || 0;
      const icons = document.getElementById("icons");
      for (let i = 0; i < n; i++) {
        icons.insertAdjacentHTML("beforeend", `<svg class="ic ${i < s ? "on" : "off"}" viewBox="0 0 100 100">${SHAPES[V.icon || "star"]}</svg>`);
      }
      document.getElementById("num").textContent = `${s}/${n}`;
      document.getElementById("label").textContent = V.label || "";
      const t = document.getElementById("title");
      if (V.title) t.textContent = V.title; else t.style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#burst", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#burst", { rotation: 0 }, { rotation: 20, duration: D, ease: "none" }, 0);
      tl.fromTo("#title", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.15);
      tl.fromTo(".ic", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.3, stagger: 0.22, ease: "back.out(3)" }, 0.35);
      tl.fromTo("#num", { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.in" }, 0.45 + n * 0.22);
      tl.to("#stage", { x: 10, y: -8, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, 0.72 + n * 0.22);
      tl.fromTo("#label", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.8 + n * 0.22);
      tl.to("#stage", { opacity: 0, duration: 0.25 }, D - 0.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
