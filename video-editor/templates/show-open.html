<!doctype html>
<!-- Show / series open. Plays right after the hook of every long-form episode.
     vars: show ("The Obsession Report" | "Put Some Respect On Their Name"), episode (optional, e.g. "Moon Knight") -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { width: {{W}}px; height: {{H}}px; }
      #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; overflow: hidden; }
      #bg { position: absolute; inset: 0; }
      #wipe { position: absolute; inset: -10%; background: var(--fire); transform-origin: left center; }
      #logo { width: 30vmin; height: 30vmin; position: relative; }
      #show { position: relative; font-size: 10vmin; text-align: center; max-width: 88vw; line-height: 1; }
      #ep { position: relative; font-size: 4.6vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="stage" class="clip" data-start="0" data-duration="{{DUR}}">
        <div id="bg" class="halftone-bg"></div>
        <div id="wipe"></div>
        <img id="logo" src="assets/logo-badge-transparent.png" alt="" />
        <div id="show" class="display ink-outline"></div>
        <div id="ep" class="tag"></div>
      </div>
    </div>
    <script>
      const V = {{VARS}};
      const D = {{DUR}};
      document.getElementById("show").textContent = V.show || "The Obsession Report";
      const ep = document.getElementById("ep");
      if (V.episode) ep.textContent = V.episode; else ep.style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0);
      tl.fromTo("#wipe", { scaleX: 0, skewX: -12 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#wipe", { scaleX: 0, transformOrigin: "right center", duration: 0.35, ease: "power3.in" }, 0.45);
      tl.fromTo("#logo", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.5)" }, 0.5);
      tl.fromTo("#show", { y: 120, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.85);
      tl.fromTo("#ep", { scale: 0, rotation: 10 }, { scale: 1, rotation: -3, duration: 0.35, ease: "back.out(3)" }, 1.15);
      tl.to("#logo", { rotation: 8, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.1);
      tl.to("#stage", { opacity: 0, duration: 0.25 }, D - 0.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
