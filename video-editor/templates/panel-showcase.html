<!doctype html>
<!-- Comic panel / cover B-roll. Full-screen; slow push on the art with a comic frame.
     vars: image (path, required), caption (optional narration-box text), credit (optional "Immortal Hulk #1 · Marvel"),
           focus (optional "x% y%" point to push toward, default "50% 40%") -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <link rel="stylesheet" href="assets/brand.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { width: {{W}}px; height: {{H}}px; }
      #stage { position: absolute; inset: 0; overflow: hidden; background: var(--pan-dark); }
      #blur { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; filter: blur(40px) brightness(0.55); }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 28%, transparent 31%); background-size: 2.4vmin 2.4vmin; }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #art { max-width: 84vw; max-height: 80vh; display: block; }
      #artwrap { overflow: hidden; line-height: 0; }
      #caption { position: absolute; left: 7vw; top: 7vh; max-width: 50vw; background: #FFF4C2; padding: 1.4vmin 2vmin; font-size: 3.4vmin; color: var(--ink); }
      #credit { position: absolute; right: 7vw; bottom: 6vh; font-size: 2.8vmin; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="stage" class="clip" data-start="0" data-duration="{{DUR}}">
        <img id="blur" alt="" />
        <div id="dots"></div>
        <div id="frame"><div id="artwrap" class="panel"><img id="art" alt="" /></div></div>
        <div id="caption" class="panel body"></div>
        <div id="credit" class="tag"></div>
      </div>
    </div>
    <script>
      const V = {{VARS}};
      const D = {{DUR}};
      document.getElementById("art").src = V.image;
      document.getElementById("blur").src = V.image;
      const cap = document.getElementById("caption");
      if (V.caption) cap.textContent = V.caption; else cap.style.display = "none";
      const cr = document.getElementById("credit");
      if (V.credit) cr.textContent = V.credit; else cr.style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
      tl.fromTo("#frame", { scale: 0.85, rotation: -2 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.4)" }, 0);
      tl.fromTo("#art", { scale: 1, transformOrigin: V.focus || "50% 40%" }, { scale: 1.12, duration: D, ease: "none" }, 0);
      tl.fromTo("#caption", { x: -60, opacity: 0, rotation: -3 }, { x: 0, opacity: 1, rotation: -1.5, duration: 0.35, ease: "back.out(2)" }, 0.5);
      tl.fromTo("#credit", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.7);
      tl.to("#stage", { opacity: 0, duration: 0.2 }, D - 0.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
