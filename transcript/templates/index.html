<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Transcript</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    .container { width: 100%; max-width: 760px; }

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; color: #111; }
    header p { margin-top: 8px; color: #555; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
    }

    form { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #c4302b; }

    button {
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #c4302b;
      color: #fff;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #eee; color: #222; }

    .error { margin-top: 14px; color: #b00020; font-size: 0.95rem; }
    .error:empty { display: none; }

    #result { margin-top: 24px; display: none; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar label { font-size: 0.9rem; color: #444; display: flex; align-items: center; gap: 6px; }
    select { padding: 8px; border-radius: 6px; border: 1.5px solid #ddd; font-size: 0.9rem; max-width: 220px; }

    .video { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 8px; margin-bottom: 16px; }

    .meta { font-size: 0.85rem; color: #666; margin-bottom: 12px; }

    #transcript {
      max-height: 60vh;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 1rem;
      white-space: pre-wrap;
    }
    .line { display: flex; gap: 12px; padding: 2px 0; }
    .line a {
      flex-shrink: 0;
      color: #c4302b;
      text-decoration: none;
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      padding-top: 2px;
      width: 52px;
    }
    .line a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube Transcript</h1>
      <p>Paste a YouTube link and get the full transcript.</p>
    </header>

    <div class="card">
      <form id="form">
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" autofocus />
        <button type="submit" id="go">Get transcript</button>
      </form>
      <p class="error" id="error"></p>

      <div id="result">
        <iframe class="video" id="player" allowfullscreen></iframe>

        <div class="toolbar">
          <label><input type="checkbox" id="timestamps" checked /> Timestamps</label>
          <select id="language" title="Caption language"></select>
          <span class="spacer"></span>
          <button type="button" class="secondary" id="copy">Copy</button>
          <button type="button" class="secondary" id="download">Download .txt</button>
        </div>

        <p class="meta" id="meta"></p>
        <div id="transcript"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let current = null;

    function fmt(seconds) {
      const s = Math.floor(seconds);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(s % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
    }

    function decode(text) {
      const el = document.createElement("textarea");
      el.innerHTML = text;
      return el.value.replace(/\s+/g, " ").trim();
    }

    function asText(withTimes) {
      if (!current) return "";
      if (withTimes) {
        return current.segments.map((s) => `[${fmt(s.start)}] ${decode(s.text)}`).join("\n");
      }
      return current.segments.map((s) => decode(s.text)).join(" ");
    }

    function render() {
      const box = $("transcript");
      box.innerHTML = "";
      if ($("timestamps").checked) {
        for (const s of current.segments) {
          const line = document.createElement("div");
          line.className = "line";
          const a = document.createElement("a");
          a.href = `https://www.youtube.com/watch?v=${current.video_id}&t=${Math.floor(s.start)}s`;
          a.textContent = fmt(s.start);
          a.addEventListener("click", (e) => {
            e.preventDefault();
            $("player").src = `https://www.youtube-nocookie.com/embed/${current.video_id}?start=${Math.floor(s.start)}&autoplay=1`;
          });
          const span = document.createElement("span");
          span.textContent = decode(s.text);
          line.append(a, span);
          box.append(line);
        }
      } else {
        box.textContent = asText(false);
      }
    }

    async function load(language) {
      const url = $("url").value.trim();
      if (!url) return;
      $("error").textContent = "";
      $("go").disabled = true;
      $("go").textContent = "Loading…";
      try {
        const res = await fetch("/api/transcript", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, language }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");

        const isNewVideo = !current || current.video_id !== data.video_id;
        current = data;
        if (isNewVideo) {
          $("player").src = `https://www.youtube-nocookie.com/embed/${data.video_id}`;
        }

        const select = $("language");
        select.innerHTML = "";
        for (const l of data.languages) {
          const opt = document.createElement("option");
          opt.value = l.code;
          opt.textContent = l.name + (l.generated ? "" : " (manual)");
          opt.selected = l.code === data.language_code;
          select.append(opt);
        }
        select.style.display = data.languages.length > 1 ? "" : "none";

        const words = asText(false).split(/\s+/).filter(Boolean).length;
        $("meta").textContent =
          `${data.language}${data.is_generated && !/auto/i.test(data.language) ? " · auto-generated" : ""} · ${words.toLocaleString()} words`;
        $("result").style.display = "block";
        render();
      } catch (err) {
        $("error").textContent = err.message;
      } finally {
        $("go").disabled = false;
        $("go").textContent = "Get transcript";
      }
    }

    $("form").addEventListener("submit", (e) => { e.preventDefault(); current = null; load(); });
    $("language").addEventListener("change", (e) => load(e.target.value));
    $("timestamps").addEventListener("change", render);

    $("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(asText($("timestamps").checked));
      $("copy").textContent = "Copied!";
      setTimeout(() => ($("copy").textContent = "Copy"), 1500);
    });

    $("download").addEventListener("click", () => {
      const blob = new Blob([asText($("timestamps").checked)], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `transcript-${current.video_id}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
